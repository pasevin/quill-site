<!DOCTYPE html>
<html lang="en">

<title>Quill — macOS to reMarkable</title>
<meta name="description" content="A macOS menu-bar utility that sends Markdown, web articles, PDFs, and EPUBs directly to your reMarkable.">

<style>
  :root {
    --cream: #F7F5EF;
    --cream-deep: #EFECE3;
    --ink: #181715;
    --ink-soft: #4F4C45;
    --ink-faint: #8C877C;
    --rule: #DAD4C8;
    --cobalt: #1D4E89;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* 2D Schematic Drafting & Fractal Background Canvas (behind Three.js) */
  #schematic-bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
    z-index: 1;
    pointer-events: none;
  }

  /* 3D Technical Three.js Canvas (transparent over schematic background) */
  #webgl {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
    z-index: 2;
    cursor: default;
  }
  #webgl.hover-quill { cursor: none; }

  /* Custom oversized technical finger pointer (shown when hovering the Quill entity) */
  #quill-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 44px;
    height: 44px;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transform: translate(-100px, -100px);
    transition: opacity 0.10s ease;
    filter: drop-shadow(0 4px 8px rgba(24, 23, 21, 0.18));
  }
  #quill-cursor.visible { opacity: 1; }
  #quill-cursor.pressed svg { transform: scale(0.88) translateY(2px); }
  #quill-cursor svg { width: 100%; height: 100%; transition: transform 0.1s ease; }

  /* Minimal Drafting Frame Corners */
  .frame-marks {
    position: fixed;
    inset: 18px;
    border: 1px dashed rgba(24, 23, 21, 0.10);
    pointer-events: none;
    z-index: 5;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 44px;
    pointer-events: none;
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    pointer-events: auto;
  }
  .wordmark svg { width: 16px; height: 16px; color: var(--ink); }
  .wordmark span {
    font-family: var(--serif);
    font-size: 24px;
    letter-spacing: 0.01em;
  }
  .spec-code {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 32px 34px;
    gap: 14px;
    pointer-events: none;
  }
  h1 {
    font-family: var(--sans);
    font-size: clamp(16px, 1.85vw, 21px);
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 680px;
    text-wrap: balance;
    background: rgba(247, 245, 239, 0.78);
    padding: 6px 16px;
    border-radius: 6px;
  }
  h1 strong {
    font-weight: 500;
    color: var(--cobalt);
  }

  .controls {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    pointer-events: auto;
  }
  .key-btn {
    appearance: none;
    background: #FFFFFF;
    border: 1px solid #C8C1B4;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.1s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .key-btn:hover { border-color: var(--cobalt); color: var(--cobalt); }
  .key-btn:active { transform: translateY(1px); }
  .controls a {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px dashed var(--rule);
  }
  .controls a:hover { color: var(--ink); border-color: var(--ink); }

  @media (max-width: 640px) {
    .frame-marks { inset: 10px; }
    header { padding: 20px 22px; }
    footer { padding: 0 20px 24px; }
  }
</style>
</head>

<header>
  <a class="wordmark" href="#">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">

    </svg>
    <span>Quill</span>

  <span class="spec-code">MACOS</span>

<footer>
  <h1>A macOS menu-bar utility for you and your <strong>AI agents</strong> to send <strong>Markdown, web articles, PDFs, and EPUBs</strong> directly to your reMarkable.</h1>

    <button class="key-btn" id="send-btn" type="button">⌥⌘R</button>

<script type="module">
import * as THREE from 'three';

// ══════════════════════════════════════════════════════════════════════
// 1. LIVING 2D TECHNICAL SCHEMATIC & RECURSIVE FRACTAL CANVAS
// ══════════════════════════════════════════════════════════════════════
const bgCanvas = document.getElementById('schematic-bg');
const bctx = bgCanvas.getContext('2d');
let bgW = window.innerWidth, bgH = window.innerHeight;
let mouseNX = 0, mouseNY = 0;

function resizeBg() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  bgW = window.innerWidth;
  bgH = window.innerHeight;
  bgCanvas.width = bgW * dpr;
  bgCanvas.height = bgH * dpr;
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeBg();

// Subtle recursive geometric fractal (nested rotated drafting squares & arcs)
function drawFractalRosette(cx, cy, radius, depth, angle, alpha) {
  if (depth <= 0 || radius < 16) return;
  bctx.save();
  bctx.translate(cx, cy);
  bctx.rotate(angle);

  bctx.strokeStyle = `rgba(24, 23, 21, ${alpha})`;
  bctx.lineWidth = 0.75;
  bctx.setLineDash(depth % 2 === 0 ? [3, 5] : [1, 4]);
  bctx.strokeRect(-radius, -radius, radius * 2, radius * 2);

  bctx.setLineDash([]);
  bctx.strokeStyle = `rgba(29, 78, 137, ${alpha * 0.65})`;
  bctx.beginPath();
  bctx.arc(0, 0, radius, 0, Math.PI * 2);
  bctx.stroke();

  bctx.restore();
  drawFractalRosette(cx, cy, radius * 0.7071, depth - 1, angle + Math.PI / 4, alpha * 0.86);
}

function drawSchematicBackground(t, pulse) {
  bctx.fillStyle = '#F7F5EF';
  bctx.fillRect(0, 0, bgW, bgH);

  // Subtle radial cream warmth
  const rad = bctx.createRadialGradient(bgW * 0.42, bgH * 0.48, 40, bgW * 0.48, bgH * 0.5, Math.max(bgW, bgH) * 0.72);
  rad.addColorStop(0, '#FDFCF8');
  rad.addColorStop(1, '#F1EDE3');
  bctx.fillStyle = rad;
  bctx.fillRect(0, 0, bgW, bgH);

  // Dotted drafting grid
  const step = 36;
  const ox = (mouseNX * -10) % step;
  const oy = (mouseNY * -10) % step;
  bctx.fillStyle = 'rgba(24, 23, 21, 0.13)';
  for (let x = ox; x < bgW; x += step) {
    for (let y = oy; y < bgH; y += step) {
      bctx.fillRect(x, y, 1.15, 1.15);
    }
  }

  // Anchor coordinates aligned to Swarm (left), Quill (center-left), and reMarkable (right)
  const sx = bgW * 0.16 + mouseNX * -14;
  const qx = bgW * 0.42 + mouseNX * -10;
  const qy = bgH * 0.48 + mouseNY * -10;
  const rx = bgW * 0.74 + mouseNX * -6;
  const ry = bgH * 0.48 + mouseNY * -6;

  // Recursive fractal compass geometry centered behind the Quill Entity
  drawFractalRosette(qx, qy, Math.min(bgW, bgH) * 0.27, 6, t * 0.045, 0.09 + pulse * 0.045);

  // Subtle architectural diagonal construction lines + outer orbital drafting arcs
  bctx.strokeStyle = 'rgba(24, 23, 21, 0.055)';
  bctx.lineWidth = 0.75;
  bctx.setLineDash([3, 9]);
  bctx.lineDashOffset = -t * 14;
  bctx.beginPath();
  bctx.moveTo(0, qy - bgH * 0.34); bctx.lineTo(bgW, qy + bgH * 0.22);
  bctx.moveTo(0, qy + bgH * 0.32); bctx.lineTo(bgW, qy - bgH * 0.24);
  bctx.stroke();

  // Animated traveling schematic lines (horizontal datum + vertical anchors)
  bctx.strokeStyle = 'rgba(24, 23, 21, 0.11)';
  bctx.lineWidth = 0.85;
  bctx.setLineDash([8, 6]);
  bctx.lineDashOffset = -t * 22;
  bctx.beginPath();
  bctx.moveTo(36, qy); bctx.lineTo(bgW - 36, qy);
  bctx.stroke();

  // Secondary parallel schematic rails above & below the main datum
  bctx.strokeStyle = 'rgba(24, 23, 21, 0.065)';
  bctx.lineWidth = 0.7;
  bctx.setLineDash([4, 8]);
  bctx.lineDashOffset = t * 16;
  bctx.beginPath();
  bctx.moveTo(64, qy - 120); bctx.lineTo(bgW - 64, qy - 120);
  bctx.moveTo(64, qy + 120); bctx.lineTo(bgW - 64, qy + 120);
  bctx.stroke();

  // Vertical anchor lines
  bctx.strokeStyle = 'rgba(24, 23, 21, 0.085)';
  bctx.setLineDash([6, 6]);
  bctx.lineDashOffset = -t * 10;
  bctx.beginPath();
  bctx.moveTo(sx, 62); bctx.lineTo(sx, bgH - 62);
  bctx.moveTo(qx, 42); bctx.lineTo(qx, bgH - 42);
  bctx.moveTo(rx, 42); bctx.lineTo(rx, bgH - 42);
  bctx.stroke();
  bctx.lineDashOffset = 0;

  // Fine architectural Vernier tick ruler along upper & lower drafting bands
  bctx.setLineDash([]);
  bctx.strokeStyle = 'rgba(24, 23, 21, 0.12)';
  bctx.lineWidth = 0.75;
  const tickStep = 24;
  const tickShift = (t * 12) % tickStep;
  bctx.beginPath();
  for (let x = 60 + tickShift; x < bgW - 60; x += tickStep) {
    const major = Math.round((x - tickShift) / tickStep) % 5 === 0;
    const hTick = major ? 9 : 4;
    bctx.moveTo(x, 62); bctx.lineTo(x, 62 + hTick);
    bctx.moveTo(x, bgH - 62); bctx.lineTo(x, bgH - 62 - hTick);
  }
  bctx.stroke();

  // Concentric dotted arcs radiating from Quill toward the tablet + live orbital ticks
  bctx.setLineDash([2, 6]);
  bctx.strokeStyle = 'rgba(29, 78, 137, 0.18)';
  bctx.lineWidth = 0.9;
  [145, 210, 280, 355].forEach((r, i) => {
    const start = -0.68 + Math.sin(t * 0.35 + i) * 0.1;
    const end = 0.68 + Math.sin(t * 0.35 + i) * 0.1;
    bctx.beginPath();
    bctx.arc(qx, qy, r, start, end);
    bctx.stroke();

    // Small traveling schematic bead riding each arc
    const ang = start + ((t * (0.28 + i * 0.06) + i * 0.37) % 1) * (end - start);
    const bx = qx + Math.cos(ang) * r;
    const by = qy + Math.sin(ang) * r;
    bctx.fillStyle = 'rgba(29, 78, 137, 0.42)';
    bctx.beginPath();
    bctx.arc(bx, by, 2.0, 0, Math.PI * 2);
    bctx.fill();
  });

  // Living signal ticks gliding across the horizontal datum line
  for (let k = 0; k < 3; k++) {
    const u = ((t * 0.16 + k * 0.333) % 1);
    const px = 48 + u * (bgW - 96);
    bctx.strokeStyle = 'rgba(29, 78, 137, 0.36)';
    bctx.lineWidth = 1.0;
    bctx.setLineDash([]);
    bctx.beginPath();
    bctx.moveTo(px - 7, qy); bctx.lineTo(px + 7, qy);
    bctx.moveTo(px, qy - 4); bctx.lineTo(px, qy + 4);
    bctx.stroke();
  }

  // Crisp schematic dimension line + arrowheads across Agents → Quill → reMarkable
  const dimY = Math.min(bgH - 130, qy + Math.min(bgW, bgH) * 0.27);
  bctx.setLineDash([]);
  bctx.strokeStyle = 'rgba(24, 23, 21, 0.22)';
  bctx.lineWidth = 0.9;
  bctx.beginPath();
  bctx.moveTo(sx, dimY); bctx.lineTo(rx, dimY);
  bctx.moveTo(sx, dimY - 5); bctx.lineTo(sx, dimY + 5);
  bctx.moveTo(qx, dimY - 6); bctx.lineTo(qx, dimY + 6);
  bctx.moveTo(rx, dimY - 6); bctx.lineTo(rx, dimY + 6);
  // Directional arrows
  bctx.moveTo(qx - 8, dimY - 3.5); bctx.lineTo(qx, dimY); bctx.lineTo(qx - 8, dimY + 3.5);
  bctx.moveTo(rx - 8, dimY - 3.5); bctx.lineTo(rx, dimY); bctx.lineTo(rx - 8, dimY + 3.5);
  bctx.stroke();

  // Small clean labels on the drafting sheet
  bctx.fillStyle = 'rgba(24, 23, 21, 0.42)';
  bctx.font = '400 10px "JetBrains Mono", monospace';
  bctx.fillText('AGENTS', sx - 20, dimY + 18);
  bctx.fillText('QUILL', qx - 16, dimY + 18);
  bctx.fillText('REMARKABLE', rx - 32, dimY + 18);
  bctx.fillStyle = 'rgba(29, 78, 137, 0.68)';
  bctx.fillText('→', (sx + qx) * 0.5 - 4, dimY - 8);
  bctx.fillText('→', (qx + rx) * 0.5 - 4, dimY - 8);

  // Corner registration crosshairs
  const marks = [[42, 76], [bgW - 42, 76], [42, bgH - 76], [bgW - 42, bgH - 76]];
  bctx.strokeStyle = 'rgba(24, 23, 21, 0.28)';
  bctx.lineWidth = 1;
  marks.forEach(([mx, my]) => {
    bctx.beginPath();
    bctx.moveTo(mx - 6, my); bctx.lineTo(mx + 6, my);
    bctx.moveTo(mx, my - 6); bctx.lineTo(mx, my + 6);
    bctx.stroke();
  });
}

// ══════════════════════════════════════════════════════════════════════
// 2. THREE.JS MINIMALIST TECHNICAL 3D STAGE
// ══════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0.15, 0.18, 6.8);
camera.lookAt(0.15, 0, 0);

// Clean bright studio HDRI for subtle crisp brushed-aluminum sheen
function buildCleanStudioEnv(renderer) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.background = new THREE.Color('#F2EFE8');
  const add = (w, h, col, pos, rot) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide }));
    m.position.set(...pos); m.rotation.set(...rot); env.add(m);
  };
  add(14, 14, new THREE.Color(1.9, 1.88, 1.82), [0, 7, 2], [Math.PI / 2, 0, 0]);
  add(4, 12, new THREE.Color(2.2, 2.25, 2.35), [7, 1, 2], [0, -Math.PI / 2, 0]);
  add(6, 12, new THREE.Color(0.28, 0.28, 0.30), [-7, 0, -2], [0, Math.PI / 2.4, 0]);
  const rt = pmrem.fromScene(env, 0.04);
  pmrem.dispose();
  return rt.texture;
}
scene.environment = buildCleanStudioEnv(renderer);

scene.add(new THREE.HemisphereLight('#FFFFFF', '#DDD6C8', 1.05));
const dirLight = new THREE.DirectionalLight('#FFFDF9', 1.35);
dirLight.position.set(-3, 5, 5);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight('#DCE8F7', 0.75);
rimLight.position.set(4, 2, -3);
scene.add(rimLight);

const worldGroup = new THREE.Group();
scene.add(worldGroup);

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// Helper: dashed 3D circle ring
function makeSoftShadowTex() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 12, 128, 128, 124);
  g.addColorStop(0.0, 'rgba(24, 23, 21, 0.24)');
  g.addColorStop(0.45, 'rgba(24, 23, 21, 0.10)');
  g.addColorStop(0.78, 'rgba(24, 23, 21, 0.025)');
  g.addColorStop(1.0, 'rgba(24, 23, 21, 0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeSoftRectShadowTex(aspect = 1.0, alpha = 0.22, blurPx = 78) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = Math.round(512 * aspect);
  const ctx = c.getContext('2d');
  const pad = 148;
  const rw = c.width - pad * 2;
  const rh = c.height - pad * 2;
  const r = Math.min(rw, rh) * 0.16;
  // Cast ONLY the blurred shadow onto the canvas (source shape drawn off-canvas)
  // so there is zero hard inner edge — pure velvety Gaussian falloff.
  const off = 2000;
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.shadowColor = `rgba(24, 23, 21, ${alpha})`;
  ctx.shadowBlur = blurPx;
  ctx.shadowOffsetX = off;
  ctx.shadowOffsetY = 0;
  ctx.beginPath();
  ctx.roundRect(pad - off, pad, rw, rh, r);
  ctx.fill();
  ctx.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const quillShadowTex = makeSoftRectShadowTex(1.0, 0.20, 72);
const rmShadowTex = makeSoftRectShadowTex(1.36, 0.26, 92);

function makeDashedRing(radius, dashSize, gapSize, color, opacity = 0.55) {
  const pts = [];
  const segs = 96;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineDashedMaterial({ color, dashSize, gapSize, transparent: true, opacity });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  return line;
}

let audioCtx = null;
let noiseBuf = null;

function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) {
      audioCtx = new Ctx();
      // Pre-build a tiny 30ms white-noise burst buffer for realistic mechanical clicks
      const len = Math.floor(audioCtx.sampleRate * 0.03);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.22));
      }
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function playSound(kind) {
  const ctx = ensureAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;

  // Mechanical click = ultra-short filtered noise impulse + crisp transient snap
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf;

  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = kind === 'hover' ? 3.2 : 2.2;

  const g = ctx.createGain();

  if (kind === 'hover') {
    // Feather-light microswitch hover tick (6ms)
    filter.frequency.setValueAtTime(3400, now);
    g.gain.setValueAtTime(0.055, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.012);
    src.connect(filter).connect(g).connect(ctx.destination);
    src.start(now); src.stop(now + 0.015);
  } else if (kind === 'quill') {
    // Crisp, satisfying tactile mechanical key click
    filter.frequency.setValueAtTime(2200, now);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.022);
    src.connect(filter).connect(g).connect(ctx.destination);
    src.start(now); src.stop(now + 0.025);

    const snap = ctx.createOscillator();
    const sg = ctx.createGain();
    snap.type = 'triangle';
    snap.frequency.setValueAtTime(1650, now);
    snap.frequency.exponentialRampToValueAtTime(420, now + 0.018);
    sg.gain.setValueAtTime(0.045, now);
    sg.gain.exponentialRampToValueAtTime(0.0008, now + 0.02);
    snap.connect(sg).connect(ctx.destination);
    snap.start(now); snap.stop(now + 0.022);
  } else if (kind === 'agent') {
    // Sharp, light precision click
    filter.frequency.setValueAtTime(3100, now);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.016);
    src.connect(filter).connect(g).connect(ctx.destination);
    src.start(now); src.stop(now + 0.02);
  } else {
    // Soft muted mechanical shutter/detent click for the Paper Pro
    filter.frequency.setValueAtTime(1400, now);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.024);
    src.connect(filter).connect(g).connect(ctx.destination);
    src.start(now); src.stop(now + 0.028);
  }
}

// Unlock AudioContext on first user gesture so hover ticks work seamlessly afterward
['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, ensureAudio, { once: true }));

// ── Raycaster Hover & Press across Quill, AI Agents & Paper Pro ─────
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(-10, -10);
const quillCursor = document.getElementById('quill-cursor');

let isHoveringQuill = false;
let isPressingQuill = false;
let hoveredAgent = null;
let isHoveringTablet = false;
let rmRecoil = 0;
let quillScaleCur = 1.0;
let quillZOffsetCur = 0.0;
let targetRX = 0.07, targetRY = 0.0;
let curRX = 0.07, curRY = 0.0;

const agentCoreMeshes = agentNodes.map((a) => a.core);
const interactiveTargets = [qSlab, quillEmblem, scrMesh, bezelPlate, ...agentCoreMeshes];

function updateInteractiveHover(clientX, clientY) {
  pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(interactiveTargets, false);

  let nextQuill = false, nextAgent = null, nextTablet = false;
  if (hits.length > 0) {
    const obj = hits[0].object;
    if (obj === qSlab || obj === quillEmblem) {
      nextQuill = true;
    } else if (obj === scrMesh || obj === bezelPlate) {
      nextTablet = true;
    } else {
      nextAgent = agentNodes.find((a) => a.core === obj) || null;
    }
  }

  const enteredNewTarget =
    (nextQuill && !isHoveringQuill) ||
    (nextTablet && !isHoveringTablet) ||
    (nextAgent !== null && nextAgent !== hoveredAgent);

  isHoveringQuill = nextQuill;
  hoveredAgent = nextAgent;
  isHoveringTablet = nextTablet;

  if (enteredNewTarget) playSound('hover');

  const anyInteractive = nextQuill || nextAgent !== null || nextTablet;
  quillCursor.style.transform = `translate(${clientX - 18}px, ${clientY - 4}px)`;
  canvas.classList.toggle('hover-quill', anyInteractive);
  quillCursor.classList.toggle('visible', anyInteractive);
}

window.addEventListener('pointermove', (e) => {
  mouseNX = e.clientX / window.innerWidth - 0.5;
  mouseNY = e.clientY / window.innerHeight - 0.5;
  targetRY = mouseNX * 0.20;
  targetRX = 0.07 + mouseNY * 0.12;
  updateInteractiveHover(e.clientX, e.clientY);
});

let pressKind = null;
let pressedAgentRef = null;

canvas.addEventListener('pointerdown', (e) => {
  updateInteractiveHover(e.clientX, e.clientY);
  if (isHoveringQuill) {
    pressKind = 'quill';
    isPressingQuill = true;
    quillCursor.classList.add('pressed');
  } else if (hoveredAgent) {
    pressKind = 'agent';
    pressedAgentRef = hoveredAgent;
    quillCursor.classList.add('pressed');
  } else if (isHoveringTablet) {
    pressKind = 'tablet';
    quillCursor.classList.add('pressed');
  }
});

window.addEventListener('pointerup', () => {
  quillCursor.classList.remove('pressed');
  if (pressKind === 'quill') {
    isPressingQuill = false;
    playSound('quill');
    dispatchPacket(clock.getElapsedTime());
  } else if (pressKind === 'agent' && pressedAgentRef) {
    playSound('agent');
    launchAgentPing(clock.getElapsedTime(), pressedAgentRef);
  } else if (pressKind === 'tablet') {
    playSound('paper');
    curRMDoc = (curRMDoc + 1) % DOCS.length;
    rmFlashEnd = clock.getElapsedTime() + 0.26;
    rmRecoil = 1.0;
  }
  pressKind = null;
  pressedAgentRef = null;
});

window.addEventListener('pointerleave', () => {
  isHoveringQuill = false;
  isPressingQuill = false;
  hoveredAgent = null;
  isHoveringTablet = false;
  pressKind = null;
  canvas.classList.remove('hover-quill');
  quillCursor.classList.remove('visible', 'pressed');
});

document.getElementById('send-btn').addEventListener('click', () => {
  playSound('quill');
  dispatchPacket(clock.getElapsedTime());
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || (e.metaKey && e.altKey && e.code === 'KeyR')) {
    e.preventDefault();
    playSound('quill');
    dispatchPacket(clock.getElapsedTime());
  }
});

function handleResize() {
  resizeBg();
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  const portrait = h > w;
  camera.position.z = portrait ? 11.8 : 9.1;
  quillGroup.position.x = portrait ? -0.35 : -0.68;
  quillGroup.position.z = portrait ? 0.65 : 0.85;
  rmGroup.position.x = portrait ? 1.55 : 2.18;
  rmGroup.position.z = portrait ? -0.45 : -0.35;
  swarmGroup.scale.setScalar(portrait ? 0.72 : 1.0);
}
handleResize();
window.addEventListener('resize', handleResize);

// ── Main 60fps Loop ─────────────────────────────────────────────────
const clock = new THREE.Clock();
let nextPing = 0.55;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  bgPulse *= 0.94;

  // 1. Living 2D technical schematic & fractal canvas
  drawSchematicBackground(t, bgPulse);

  // 2. Smooth subtle 3D parallax
  curRX += (targetRX - curRX) * 0.075;
  curRY += (targetRY - curRY) * 0.075;
  worldGroup.rotation.set(curRX, curRY, 0);

  // 3. Quill Entity technical motion + tactile hover & press feedback
  const targetScale = isPressingQuill ? 0.93 : (isHoveringQuill ? 1.065 : 1.0);
  const targetZOff  = isPressingQuill ? -0.10 : (isHoveringQuill ? 0.14 : 0.0);
  quillScaleCur += (targetScale - quillScaleCur) * 0.18;
  quillZOffsetCur += (targetZOff - quillZOffsetCur) * 0.18;

  const baseZ = window.innerHeight > window.innerWidth ? 0.65 : 0.85;
  quillGroup.position.y = 0.08 + Math.sin(t * 1.2) * 0.045;
  quillGroup.position.z = baseZ + quillZOffsetCur;
  quillGroup.scale.setScalar(quillScaleCur);
  quillGroup.rotation.y = 0.22 + Math.sin(t * 0.7) * 0.06 + bgPulse * 0.09;

  // Highlight CAD frame & tighten dashed cage on hover/press
  qEdgesMat.color.set(isHoveringQuill ? '#1D4E89' : '#181715');
  qEdgesMat.opacity = isHoveringQuill ? 0.92 : 0.52;
  cageMat.opacity = isPressingQuill ? 0.90 : (isHoveringQuill ? 0.78 : 0.45);
  const cageScale = isPressingQuill ? 0.95 : (isHoveringQuill ? 1.04 : 1.0);
  cage.scale.lerp(new THREE.Vector3(cageScale, cageScale, cageScale), 0.16);

  ringA.rotation.z = t * (isHoveringQuill ? 0.65 : 0.32);
  ringB.rotation.z = -t * (isHoveringQuill ? 0.48 : 0.24);
  cage.rotation.z = Math.sin(t * 0.4) * 0.04;

  // 4. Secondary reMarkable Paper Pro subtle float
  rmGroup.position.y = -0.02 + Math.sin(t * 1.0 + 1.4) * 0.035;

  // 5. Expanding dashed pulse rings
  for (let i = pulseCircles.length - 1; i >= 0; i--) {
    const p = pulseCircles[i];
    p.age += 0.022;
    const s = 1 + p.age * 1.9;
    p.line.scale.set(s, s, 1);
    p.line.material.opacity = Math.max(0, (1 - p.age) * 0.75);
    if (p.age >= 1) {
      quillGroup.remove(p.line);
      p.line.geometry.dispose();
      p.line.material.dispose();
      pulseCircles.splice(i, 1);
    }
  }

  // 5b. Animate the AI Agent Swarm gently orbiting & pinging Quill
  agentNodes.forEach((a) => {
    const s = a.seed;
    a.group.position.x = s.x + Math.sin(t * s.speed * 0.7 + s.phase) * 0.14;
    a.group.position.y = s.y + Math.cos(t * s.speed * 0.85 + s.phase) * 0.16;
    a.group.position.z = s.z + Math.sin(t * s.speed * 0.6 + s.phase * 1.3) * 0.12;
    a.core.rotation.x = t * 0.7 + s.phase;
    a.core.rotation.y = t * 0.9 + s.phase;
    a.halo.rotation.z = -t * 0.6 + s.phase;

    // Update tether endpoints to track drifting agent + Quill
    const tp = a.tetherGeo.attributes.position;
    tp.setXYZ(0, a.group.position.x, a.group.position.y, a.group.position.z);
    tp.setXYZ(1, quillGroup.position.x, quillGroup.position.y, quillGroup.position.z);
    tp.needsUpdate = true;

    const hoverBoost = (a === hoveredAgent) ? 0.22 : 0;
    if (a.pingGlow > 0.01) {
      a.pingGlow *= 0.92;
      a.core.material.color.set('#1D4E89');
      a.wireMat.color.set('#FFFFFF');
      a.group.scale.setScalar(1 + a.pingGlow * 0.25 + hoverBoost);
    } else {
      a.core.material.color.set(hoverBoost > 0 ? '#1D4E89' : '#222429');
      a.wireMat.color.set('#FAF8F2');
      a.group.scale.setScalar(1 + hoverBoost);
    }
  });

  // Subtle Paper Pro recoil when clicked
  if (rmRecoil > 0.005) {
    rmRecoil *= 0.88;
    rmGroup.rotation.y = -0.36 + Math.sin(rmRecoil * Math.PI) * 0.08;
  } else {
    rmGroup.rotation.y = -0.36;
  }

  // Periodic swarm pings → when ping arrives at Quill, Quill dispatches to reMarkable!
  if (t >= nextPing) {
    launchAgentPing(t);
    nextPing = t + 1.35 + Math.random() * 0.75;
  }

  for (let i = activePings.length - 1; i >= 0; i--) {
    const p = activePings[i];
    const u = Math.min(1, (t - p.start) / p.duration);
    const ease = u * u * (3 - 2 * u);
    p.dot.position.copy(p.curve.getPoint(ease));
    p.arcMat.opacity = Math.sin(u * Math.PI) * 0.65;
    p.ring.scale.setScalar(1 + u * 2.2);
    p.ring.material.opacity = Math.max(0, (1 - u) * 0.7);

    if (u >= 0.92 && !p.triggeredQuill) {
      p.triggeredQuill = true;
      dispatchPacket(t);
    }
    if (u >= 1) {
      worldGroup.remove(p.dot);
      worldGroup.remove(p.arcLine);
      worldGroup.remove(p.ring);
      p.dot.geometry.dispose(); p.dot.material.dispose();
      p.arcGeo.dispose(); p.arcMat.dispose();
      p.ring.geometry.dispose(); p.ring.material.dispose();
      activePings.splice(i, 1);
    }
  }

  // 7. Update traveling curling schematic packets
  for (let i = activePackets.length - 1; i >= 0; i--) {
    const f = activePackets[i];
    const u = Math.min(1, (t - f.start) / f.duration);
    const ease = 1 - Math.pow(1 - u, 2.5);

    const pt = f.curve.getPoint(ease);
    f.mesh.position.copy(pt);
    f.mesh.rotation.set(
      (1 - ease) * 0.35 + 0.08 * ease,
      0.24 * (1 - ease) - 0.46 * ease,
      Math.sin(ease * Math.PI) * -0.14
    );
    const sc = 0.42 + 0.68 * Math.sin(Math.min(1, ease * 1.15) * Math.PI * 0.5);
    f.mesh.scale.set(sc, sc, 1);

    // Subtle tactile paper curve in flight
    const air = Math.sin(ease * Math.PI);
    const pos = f.geo.attributes.position;
    for (let v = 0; v < pos.count; v++) {
      const bx = packetBasePos[v * 3];
      const by = packetBasePos[v * 3 + 1];
      pos.setZ(v, Math.sin(bx * 3.5 + t * 4.5) * 0.08 * air + Math.cos(by * 2.5 - t * 3.5) * 0.05 * air);
    }
    pos.needsUpdate = true;
    f.geo.computeVertexNormals();

    const op = u < 0.12 ? u / 0.12 : (u > 0.86 ? Math.max(0, (1 - u) / 0.14) : 1);
    f.mat.opacity = op * 0.96;
    f.wire.material.opacity = op * 0.7;

    if (u >= 0.87 && !f.landed) {
      f.landed = true;
      curRMDoc = f.idx;
      rmFlashEnd = t + 0.28;
    }
    if (u >= 1) {
      worldGroup.remove(f.mesh);
      f.geo.dispose(); f.mat.dispose();
      f.wire.geometry.dispose(); f.wire.material.dispose();
      activePackets.splice(i, 1);
    }
  }

  // 8. Authentic e-ink refresh flicker on arrival
  if (t < rmFlashEnd) {
    const rem = (rmFlashEnd - t) / 0.28;
    drawRMPage(curRMDoc, rem > 0.5 ? 0.85 : 0.2);
  } else if (rmFlashEnd > 0 && t >= rmFlashEnd) {
    drawRMPage(curRMDoc, 0);
    rmFlashEnd = 0;
  }

  renderer.render(scene, camera);
}

animate();
</script>
